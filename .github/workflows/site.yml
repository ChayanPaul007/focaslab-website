name: Sync publications & news, deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1,4"   # Mondays and Thursdays 07:47 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: focaslab-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Sync publications from Google Scholar
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Write news with Gemini (new papers + LinkedIn)
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
          LINKEDIN_RSS_URL: ${{ vars.LINKEDIN_RSS_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_news.py

      - name: Store images locally
        run: python scripts/localize_images.py

      - name: Commit changes
        run: |
          git config user.name "focas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "chore: sync publications, news & images [skip ci]" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: focaslab-site
      - id: deploy
        uses: actions/deploy-pages@v4
